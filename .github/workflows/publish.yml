name: Publish npm package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.target_commitish == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.6.2
      - name: Verify release commit belongs to the default branch
        run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Compute GitHub Pages base
        run: node scripts/pages-base.mjs
        env:
          FF_BASE: ${{ vars.FF_BASE }}
      - run: npm ci
      - name: Verify package identity and release tag
        id: release
        run: npm run release:check
      - run: npm run check
      - run: npm run build-storybook
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:storybook
      - run: npm run benchmark
      - name: Publish verified package using npm trusted publishing
        run: npm publish --access public --tag "$NPM_DIST_TAG" --ignore-scripts
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
