name: Check and deploy Forest & Fern
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Compute GitHub Pages base
        run: node scripts/pages-base.mjs
        env:
          FF_BASE: ${{ vars.FF_BASE }}
      - run: npm ci
      - name: Build and check
        run: npm run check
      - run: npm run build-storybook
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:storybook
      - run: npm run benchmark
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
